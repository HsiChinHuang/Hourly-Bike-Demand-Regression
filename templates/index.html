<!DOCTYPE html>
<html>
<head>
    <title>Bike Demand Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 180px; font-weight: bold; }
        input, select { padding: 5px; width: 200px; }
        button { padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background-color: #d4edda; color: #155724; border-radius: 5px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🚲 Hourly Bike Demand Predictor</h1>
    <p>Enter the conditions below to predict the expected number of rentals.</p>
    
    <form action="/predict" method="POST">
        <div class="form-group">
            <label>Season:</label>
            <select name="season">
                <option value="1">1 - Spring</option>
                <option value="2">2 - Summer</option>
                <option value="3">3 - Fall</option>
                <option value="4">4 - Winter</option>
            </select>
        </div>
        <div class="form-group">
            <label>Year:</label>
            <select name="yr">
                <option value="0">2011</option>
                <option value="1">2012</option>
            </select>
        </div>
        <div class="form-group">
            <label>Month (1-12):</label>
            <input type="number" name="mnth" min="1" max="12" value="6" required>
        </div>
        <div class="form-group">
            <label>Hour (0-23):</label>
            <input type="number" name="hr" min="0" max="23" value="8" required>
        </div>
        <div class="form-group">
            <label>Holiday (0/1):</label>
            <select name="holiday">
                <option value="0">0 - No</option>
                <option value="1">1 - Yes</option>
            </select>
        </div>
        <div class="form-group">
            <label>Weekday (0-6):</label>
            <input type="number" name="weekday" min="0" max="6" value="1" required>
        </div>
        <div class="form-group">
            <label>Working Day (0/1):</label>
            <select name="workingday">
                <option value="1">1 - Yes</option>
                <option value="0">0 - No</option>
            </select>
        </div>
        <div class="form-group">
            <label>Weather:</label>
            <select name="weathersit">
                <option value="1">1 - Clear</option>
                <option value="2">2 - Mist</option>
                <option value="3">3 - Light Rain/Snow</option>
                <option value="4">4 - Heavy Rain/Snow</option>
            </select>
        </div>
        <div class="form-group">
            <label>Temp (0.0-1.0):</label>
            <input type="number" step="0.01" name="temp" min="0" max="1" value="0.5" required>
        </div>
        <div class="form-group">
            <label>Humidity (0.0-1.0):</label>
            <input type="number" step="0.01" name="hum" min="0" max="1" value="0.6" required>
        </div>
        <div class="form-group">
            <label>Windspeed (0.0-1.0):</label>
            <input type="number" step="0.01" name="windspeed" min="0" max="1" value="0.2" required>
        </div>
        <button type="submit">Predict Demand</button>
    </form>

    {% if prediction_text %}
    <div class="result">
        {{ prediction_text }}
    </div>
    {% endif %}
</body>
</html>
